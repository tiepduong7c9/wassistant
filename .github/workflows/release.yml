name: Release (beta)

# Push a tag like `v0.1.0-beta` to build all platforms and publish a
# GitHub prerelease (beta) with the installers attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64: produces .deb (Ubuntu/Debian), .rpm (Fedora) and .AppImage
          - platform: ubuntu-22.04
            args: ""
          # Linux arm64: same bundles, built natively on GitHub's Arm runners
          # (free for public repos). Native build avoids the broken
          # cross-compilation story for the AppImage tooling.
          - platform: ubuntu-22.04-arm
            args: ""
          # Windows x86_64: produces .msi and .exe (NSIS) installers
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            file

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish beta release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "wassistant ${{ github.ref_name }} (beta)"
          releaseBody: "Beta release. Download the installer for your platform from the assets below."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
